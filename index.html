<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INKLU – Find accessible places</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap">
  <a class="brand" href="index.html"><img class="logo" src="inklu%20logo.png" alt="">INKLU</a>
  <nav aria-label="Main"><a href="index.html" aria-current="page">Home</a><a href="about.html">About</a><a href="product.html">Product</a></nav>
</div></header>

<main id="main" class="wrap">
  <section class="hero">
    <h1>Find places that welcome everyone</h1>
    <p>Search places and see how accessible they are for people with disabilities.</p>
  </section>
  <div class="search-sticky">
    <form id="search" role="search">
      <label for="q" class="skip">Search places</label>
      <input id="q" type="search" placeholder="Search places" autocomplete="off">
      <button type="submit" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </form>
  </div>
  <ul id="grid" class="grid"></ul>
  <p id="empty" class="empty" role="status" hidden>No places match your search. Try a different name.</p>
</main>

<dialog id="modal" aria-labelledby="m-title">
  <div class="modal-in"><button class="close" type="button" aria-label="Close">&times;</button><div id="m-body"></div></div>
</dialog>

<footer><div class="wrap">© 2026 INKLU. Accessibility information for everyone.</div></footer>
<script src="script.js"></script>
</body>
</html>
